apiVersion: v1
kind: Service
metadata:
  name: juicefs-metadata
  namespace: kube-system
  labels:
    app: juicefs-metadata
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: valkey
      name: valkey
  selector:
    app: juicefs-metadata
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juicefs-metadata
  namespace: kube-system
  labels:
    app: juicefs-metadata
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: juicefs-metadata
  template:
    metadata:
      labels:
        app: juicefs-metadata
    spec:
      nodeSelector:
        kubernetes.io/hostname: ai
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: valkey
          image: valkey/valkey:9
          args:
            - --save
            - "900"
            - "1"
            - --save
            - "300"
            - "10"
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
          ports:
            - containerPort: 6379
              name: valkey
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: juicefs-metadata-data
