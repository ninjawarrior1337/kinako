apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f compose.yaml
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: mc
  name: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: mc
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f compose.yaml
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: mc
    spec:
      containers:
        - env:
            - name: EULA
              value: "TRUE"
            - name: OPS
              value: ninjawarrior1337
            - name: MEMORY
              value: "2684M"
          image: ghcr.io/itzg/minecraft-server:2026.7.0-java25
          name: mc
          ports:
            - containerPort: 25565
              protocol: TCP
          stdin: true
          tty: true
          volumeMounts:
            - mountPath: /data
              name: mc-data
          resources:
            requests:
              memory: "2G"
              cpu: "500m"
            limits:
              memory: "3G"
              cpu: "2"
          startupProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            successThreshold: 1
            timeoutSeconds: 30
          readinessProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 30
      restartPolicy: Always
      volumes:
        - name: mc-data
          persistentVolumeClaim:
            claimName: mc-data
