apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vanilla-minecraft
spec:
  serviceName: vanilla-minecraft
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app: vanilla-minecraft
  template:
    metadata:
      labels:
        app: vanilla-minecraft
    spec:
      containers:
        - env:
            - name: EULA
              value: "TRUE"
            - name: OPS
              value: ninjawarrior1337
            - name: MEMORY
              value: "2684M"
            - name: MC_PORT
              value: "25565"
          image: ghcr.io/itzg/minecraft-server:2026.8.1-java25
          name: mc
          ports:
            - containerPort: 25565
              protocol: TCP
          stdin: true
          tty: true
          volumeMounts:
            - mountPath: /data
              name: mc-data
          resources:
            requests:
              memory: "2.5Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2"
          startupProbe:
            exec:
              command:
                - mc-health
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            successThreshold: 1
            timeoutSeconds: 30
          readinessProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 30
          livenessProbe:
            exec:
              command:
                - mc-health
            periodSeconds: 10
            failureThreshold: 3
            successThreshold: 1
            timeoutSeconds: 30
      restartPolicy: Always
      volumes:
        - name: mc-data
          persistentVolumeClaim:
            claimName: mc-data
