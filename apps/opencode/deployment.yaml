apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  labels:
    app: opencode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: opencode
        image: ghcr.io/anomalyco/opencode:1.14.28
        command: ["opencode", "serve", "--hostname", "0.0.0.0"]
        ports:
        - containerPort: 4096
          name: http
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        env:
        - name: TZ
          value: America/Los_Angeles
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "2"
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: opencode-workspace
