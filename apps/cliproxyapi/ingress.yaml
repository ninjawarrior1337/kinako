apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cliproxyapi
  annotations:
    tailscale.com/proxy-group: web-proxies
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - cliproxyapi
  defaultBackend:
    service:
      name: cliproxyapi
      port:
        number: 8317
