apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: executor
  annotations:
    tailscale.com/proxy-group: web-proxies
    tailscale.com/funnel: "true"
spec:
  defaultBackend:
    service:
      name: executor
      port:
        number: 4400
  ingressClassName: tailscale
  tls:
    - hosts:
        - executor
