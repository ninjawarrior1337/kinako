apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels:
    app: executor
spec:
  replicas: 1
  # SQLite over a single ReadWriteOnce volume: never run two writers at once.
  # v2 uses an embedded PGlite database under /app/data (same constraint).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: executor
  template:
    metadata:
      labels:
        app: executor
    spec:
      containers:
        - name: executor
          image: ghcr.io/usefulsoftwareco/executor-selfhost:2.0.0-beta.11
          ports:
            - containerPort: 4400
              name: http
          env:
            - name: TZ
              value: America/Los_Angeles
            - name: BETTER_AUTH_URL
              value: https://executor.tail5158.ts.net
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: executor-data
